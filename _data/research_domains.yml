# Display labels, subtopics, colors and ordering for the application domains.
#
# The tags themselves live in _bibliography/papers.bib, in each entry's
# `domain` field (comma-separated if a paper spans several). Every entry needs
# at least one domain listed below.

- tag: work
  label: Work & Productivity
  subtopics: How people get knowledge work done with AI.
  color: --cp-domain-work

- tag: law
  label: Law
  subtopics: How legal experts reason, work and adopt AI.
  color: --cp-domain-law

- tag: mass-communication
  label: Mass Communication
  subtopics: How media messages shape public attitudes and behavior.
  color: --cp-domain-communication

- tag: social-networks
  label: Social Networks
  subtopics: How content and ideas spread through online networks.
  color: --cp-domain-networks

- tag: digital-humanities
  label: Digital Humanities
  subtopics: Computational readings of literary and scholarly texts.
  color: --cp-domain-humanities

- tag: domain-general
  label: General
  subtopics: Methods that apply across fields.
  color: --cp-domain-general
