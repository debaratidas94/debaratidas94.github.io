# Display labels, subtopics and ordering for the research areas.
#
# The tags themselves live in _bibliography/papers.bib, in each entry's
# `keywords` field. This file controls their names, subtopics and ordering.
#
# To retag a paper, edit its `keywords` in papers.bib. Nothing here needs to
# change. A tag that is not listed below still appears in the filter, labelled
# from the tag itself and sorted to the end.

- tag: human-ai-interaction
  label: Human-AI Interaction
  subtopics: Collaborative interactions, agent workflows, personalization

- tag: natural-language-processing
  label: Natural Language Processing
  subtopics: Language generation, style transfer, synthetic-data evaluation, multimodal reasoning

- tag: computational-social-science
  label: Computational Social Science
  subtopics: Public opinion, persuasion, consumer behavior

- tag: network-science
  label: Network Science
  subtopics: Social networks, information diffusion

- tag: machine-learning-data-mining
  label: Machine Learning & Data Mining
  subtopics: Clustering, pattern discovery
